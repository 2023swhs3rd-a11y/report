<!DOCTYPE html><html><head><meta charset="utf-8">
<!-- 미리보기 이미지(og.png, 1200×630) 원본. tools/render-og.js 로 다시 만든다 -->
<link rel="stylesheet" href="/assets/fonts/pretendard/pretendard.css">
<style>
*{box-sizing:border-box} html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;font-family:"Pretendard Variable",Pretendard,"Noto Sans CJK KR",sans-serif;word-break:keep-all;
 background:#fff9f0;background-image:radial-gradient(900px 520px at 0% -10%,rgba(255,214,165,.75),transparent 60%),radial-gradient(800px 480px at 110% 110%,rgba(186,230,253,.6),transparent 60%);
 display:grid;grid-template-columns:540px 1fr;align-items:center;padding:0 48px 0 72px;gap:24px;position:relative;color:#1f2430}
.kick{display:inline-flex;align-items:center;gap:8px;font-size:26px;font-weight:800;color:#b45309;background:#fff1dc;border-radius:999px;padding:8px 20px}
h1{margin:22px 0 18px;font-size:76px;line-height:1.12;font-weight:850;letter-spacing:-2.5px}
h1 em{font-style:normal;background:linear-gradient(transparent 60%,rgba(251,191,36,.6) 60%)}
p{margin:0;font-size:28px;line-height:1.45;color:#4b5160;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.chips span{background:#fff;border:2px solid #eee3d3;border-radius:999px;padding:8px 18px;font-size:24px;font-weight:700}
.chips .c{border-color:#fdba74;color:#9a3412} .chips .h{border:2px dashed #93b4f5;color:#1e40af}
.art{width:100%;filter:drop-shadow(0 14px 26px rgba(120,80,20,.16))}
.school{position:absolute;left:72px;bottom:38px;font-size:22px;font-weight:700;color:#1e3a8a;display:flex;align-items:center;gap:10px}
.school:before{content:"";width:10px;height:10px;border-radius:50%;background:#1e3a8a}
.fav{position:absolute;right:56px;bottom:30px;width:56px;height:56px}
</style></head><body>
<div>
 <span class="kick">🗺️ 1학년 중점 진로 활동</span>
 <h1>진로 빌드업 맵<br><em>탐구 보고서</em></h1>
 <p>궁금한 것을 질문 하나로 만들고,<br>자료를 찾아 내 힘으로 답해 봐요</p>
 <div class="chips"><span class="c">🏫 수업 3번</span><span class="h">🏠 과제 2번</span><span>👀 둘러보기</span></div>
</div>
<img class="art" src="../../img/map.svg" alt="">
<div class="school">봉일천고등학교 진로진학부</div>
</body></html>
